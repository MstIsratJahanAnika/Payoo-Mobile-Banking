<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- font css part -->
    <style>
        * {
            /* shobar moddhe boshe jabe*/
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto"> <!--min height screen er shob tuku-->

</body>

<header class="border-b-1 border-gray-300 sticky top-0 bg-base-200 z-10"> <!--sticky position-->
    <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <!-- left side -->
        <div class="left flex gap-2">
            <div class="logo w-[60px]">
                <img src="assets/logo.png" alt="">
            </div>
            <!-- text part beside image -->
            <div>
                <h2 class="text-2xl font-bold"> $ <span id="balance">45000</span></h2>
                <!--span tag a balance, changeable tai-->
                <p class="text-neutral/50">Available Balance</p> <!--opacity 50%-->
            </div>
        </div>

        <!-- right side -->
        <div class="right">
            <a href="index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>Log out</a>
            <!--daisy class - btn -->
            <!-- button na hoye anchor hobe ja logout a login page a niye jabe -->
        </div>
    </section>
</header>

<!-- welcome to payoo -->
<section class="w-11/12 mx-auto py-8 space-y-5">
    <h2 class="text-2xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
    <p class="text-[#080808]/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

    <div class="buttons grid grid-cols-3 gap-[16.5px]">
        <!-- button-1 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>
        <!-- button-2 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-2.png" alt="">
            <p>Cashout</p>
        </button>
        <!-- button-3 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-3.png" alt="">
            <p>Transfer Money</p>
        </button>
        <!-- button-4 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-4.png" alt="">
            <p>Get Bonus</p>
        </button>
        <!-- button-5 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-5.png" alt="">
            <p>Pay Bill</p>
        </button>
        <!-- button-6 -->
        <button class="btn btn-primary btn-soft flex-col h-full py-5 px-2.5 rounded-[12px]">
            <img src="assets/opt-6.png" alt="">
            <p>Transactions</p>
        </button>
    </div>
</section>

<!-- form -->
<section id="Cashout" class="w-11/12 mx-auto py-5">

    <h2 class="text-xl font-bold">Cashout</h2>
    <div class="card bg-base-100 w-full max-w-full shadow mt-8">
        <div class="card-body">
            <fieldset class="fieldset">
                <label class="label text-neutral font-bold">Agent Number</label>
                <input id="agent-number" type="text" maxlength="11" minlength="11"
                    class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit number" />

                <br>
                <label class="label text-neutral font-bold">Amount</label>
                <input type="text" id="amount"
                    class="input rounded-full bg-base-200 w-full" placeholder="Enter amount to withdraw" />

                <br>
                <label class="label text-neutral font-bold">Pin Number</label>
                <input type="text" id="pin-number" maxlength="4" minlength="4"
                    class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 digit pin number" />
                <button id="withdraw-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
            </fieldset>
        </div>
    </div>
</section>

<script src="script/machine.js"></script>
<script src="script/cashout.js"></script>

</html>
